<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="login.css">
    <title>El Filete — Iniciar Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <img src="Imagenes/Logo.jpg" alt="El Filete" onerror="this.style.display='none'">
            </div>
            <h1 class="login-title">El Filete</h1>
            <p class="login-subtitle">Sistema POS — Acceso al Panel</p>

            <form id="login-form" autocomplete="off">
                <div class="form-group">
                    <label for="username"><i class="fa-solid fa-user"></i> Usuario</label>
                    <input type="text" id="username" name="username" placeholder="Ingresa tu usuario" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password"><i class="fa-solid fa-lock"></i> Contraseña</label>
                    <div class="input-with-icon">
                        <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
                        <button type="button" class="toggle-pwd" id="toggle-pwd" tabindex="-1">
                            <i class="fa-solid fa-eye" id="pwd-icon"></i>
                        </button>
                    </div>
                </div>
                <div id="login-error" class="error-msg" style="display:none;"></div>
                <button type="submit" class="btn-login" id="btn-login">
                    <span id="btn-text"><i class="fa-solid fa-right-to-bracket"></i> Iniciar Sesión</span>
                    <span id="btn-loading" style="display:none;"><i class="fa-solid fa-spinner fa-spin"></i> Verificando...</span>
                </button>
            </form>

            <div class="login-footer">
                <small></small>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('login-form');
        const errorDiv = document.getElementById('login-error');
        const btnLogin = document.getElementById('btn-login');
        const btnText = document.getElementById('btn-text');
        const btnLoading = document.getElementById('btn-loading');

        // Mostrar/ocultar contraseña
        document.getElementById('toggle-pwd').addEventListener('click', function() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('pwd-icon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.className = 'fa-solid fa-eye-slash';
            } else {
                pwd.type = 'password';
                icon.className = 'fa-solid fa-eye';
            }
        });

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            errorDiv.style.display = 'none';
            btnText.style.display = 'none';
            btnLoading.style.display = 'inline';
            btnLogin.disabled = true;

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                const resp = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ username, password })
                });
                const data = await resp.json();

                if (resp.ok) {
                    window.location.href = '/Facturacion.html';
                } else {
                    errorDiv.textContent = data.error || 'Error desconocido';
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.textContent = 'Error de conexión con el servidor';
                errorDiv.style.display = 'block';
            } finally {
                btnText.style.display = 'inline';
                btnLoading.style.display = 'none';
                btnLogin.disabled = false;
            }
        });
    </script>
</body>
</html>
